name: Build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_tvos:
    name: Build tvOS 0.5.0 (unsigned)
    runs-on: macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Archive tvOS
        uses: ./.github/actions/apple-archive
        with:
          is-tv: "true"
          siri-enabled: "false"
          artifact-name: reacttube-tvos-no-siri
